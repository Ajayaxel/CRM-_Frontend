<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMN Connect · Tenant Portal</title>
  <style>
    :root { --navy:#132376; --gold:#E6A23C; --ink:#1c2333; --ink2:#6b7280; --line:#e7e2d8; --green:#2f9e63; --amber:#c67c1e; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:linear-gradient(160deg,#f6f2ea,#eef1f8); color:var(--ink); min-height:100vh; padding:20px; }
    .wrap { max-width:560px; margin:0 auto; }
    .head { background:var(--navy); color:#fff; padding:22px 24px; border-radius:18px 18px 0 0; }
    .brand { font-weight:800; font-size:18px; display:flex; align-items:center; gap:8px; }
    .brand .dot { width:22px;height:22px;border-radius:7px;background:var(--gold); }
    .head p { margin:8px 0 0; opacity:.85; font-size:13px; }
    .card { background:#fff; border:1px solid var(--line); border-top:none; padding:22px 24px; }
    .card:last-child { border-radius:0 0 18px 18px; }
    h3 { margin:0 0 12px; font-size:15px; }
    label { display:block; font-size:12px; font-weight:600; color:var(--ink2); margin:10px 0 4px; }
    input,select,textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; }
    button { width:100%; margin-top:16px; padding:13px; border:none; border-radius:11px; background:var(--navy); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; }
    .row { display:flex; gap:10px; }
    .row > * { flex:1; }
    .ticket { border:1px solid var(--line); border-radius:12px; padding:13px; margin-top:10px; }
    .t-head { display:flex; justify-content:space-between; align-items:center; }
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
    .muted { color:var(--ink2); font-size:12px; }
    .emergency { display:flex; align-items:center; gap:8px; margin-top:12px; font-size:13px; }
    .ok { text-align:center; padding:12px; margin-top:12px; background:#e9f7ef; color:var(--green); border-radius:10px; font-weight:700; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brand"><span class="dot"></span> BMN Connect</div>
      <p id="sub">Tenant Portal</p>
    </div>
    <div class="card">
      <h3>Report a maintenance issue</h3>
      <div id="form">
        <label>Issue title</label>
        <input id="title" placeholder="e.g. Kitchen tap leaking" />
        <label>Describe the issue</label>
        <textarea id="desc" rows="3" placeholder="What's happening, since when…"></textarea>
        <div class="row">
          <div>
            <label>Category</label>
            <select id="category">
              <option value="PLUMBING">🚿 Plumbing</option><option value="ELECTRICAL">⚡ Electrical</option>
              <option value="HVAC">❄️ Heating / AC</option><option value="APPLIANCE">🔌 Appliance</option>
              <option value="STRUCTURAL">🏗️ Structural</option><option value="PEST">🐜 Pest</option>
              <option value="CLEANING">🧹 Cleaning</option><option value="SECURITY">🔒 Security</option>
              <option value="INTERNET">📶 Internet</option><option value="OTHER">🔧 Other</option>
            </select>
          </div>
          <div>
            <label>Priority</label>
            <select id="priority"><option value="LOW">Low</option><option value="MEDIUM" selected>Medium</option><option value="HIGH">High</option></select>
          </div>
        </div>
        <label class="emergency"><input type="checkbox" id="emergency" style="width:auto" /> 🚨 This is an emergency (4-hour response)</label>
        <button id="submit" onclick="submit()">Submit request</button>
      </div>
    </div>
    <div class="card">
      <h3>Your tickets</h3>
      <div id="tickets"><div class="muted">Loading…</div></div>
    </div>
  </div>

  <script>
    const lease = new URLSearchParams(location.search).get('lease');
    const STATUS = { OPEN:['#fdf2e2','#c67c1e','Open'], ASSIGNED:['#e9ecfb','#132376','Assigned'], IN_PROGRESS:['#e9ecfb','#132376','In progress'], ON_HOLD:['#f1efec','#6b7280','On hold'], RESOLVED:['#e9f7ef','#2f9e63','Resolved'], CLOSED:['#e9f7ef','#2f9e63','Closed'], CANCELLED:['#fce8e8','#c0392b','Cancelled'] };
    const CAT = { PLUMBING:'🚿',ELECTRICAL:'⚡',HVAC:'❄️',APPLIANCE:'🔌',STRUCTURAL:'🏗️',PEST:'🐜',CLEANING:'🧹',SECURITY:'🔒',INTERNET:'📶',OTHER:'🔧' };

    async function load() {
      if (!lease) { document.getElementById('tickets').innerHTML = '<div class="muted">Invalid portal link.</div>'; return; }
      try {
        const r = await fetch('/api/complaints/portal/' + encodeURIComponent(lease));
        if (!r.ok) throw new Error();
        const d = await r.json();
        const p = d.lease.property;
        document.getElementById('sub').textContent = `${d.lease.tenantName}${p ? ' · ' + (p.reference) : ''}${p && p.area ? ' · ' + p.area : ''}`;
        renderTickets(d.complaints);
      } catch { document.getElementById('tickets').innerHTML = '<div class="muted">Could not load your tickets.</div>'; }
    }

    function renderTickets(list) {
      const el = document.getElementById('tickets');
      if (!list.length) { el.innerHTML = '<div class="muted">No tickets yet.</div>'; return; }
      el.innerHTML = list.map(c => {
        const s = STATUS[c.status] || STATUS.OPEN;
        return `<div class="ticket"><div class="t-head"><strong>${CAT[c.category]||''} ${c.title}</strong>
          <span class="badge" style="background:${s[0]};color:${s[1]}">${s[2]}</span></div>
          <div class="muted" style="margin-top:4px">${c.ticketNo} · raised ${new Date(c.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div></div>`;
      }).join('');
    }

    async function submit() {
      const btn = document.getElementById('submit');
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('desc').value.trim();
      if (!title || !description) { alert('Please add a title and description.'); return; }
      btn.disabled = true; btn.textContent = 'Submitting…';
      try {
        const r = await fetch('/api/complaints/portal', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ leaseId: lease, title, description,
            category: document.getElementById('category').value,
            priority: document.getElementById('priority').value,
            emergency: document.getElementById('emergency').checked }),
        });
        if (!r.ok) throw new Error();
        document.getElementById('form').innerHTML = '<div class="ok">✓ Request submitted — our team will be in touch.</div>';
        load();
      } catch { btn.disabled = false; btn.textContent = 'Try again'; }
    }

    load();
  </script>
</body>
</html>
