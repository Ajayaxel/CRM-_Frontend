<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMN Connect · Secure Payment</title>
  <style>
    :root { --navy:#132376; --gold:#E6A23C; --cream:#FBF7EF; --ink:#1c2333; --ink2:#6b7280; --line:#e7e2d8; --green:#2f9e63; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(160deg,#f6f2ea,#eef1f8); color: var(--ink); display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; width:100%; max-width:420px; border:1px solid var(--line); border-radius:20px; box-shadow:0 20px 50px rgba(19,35,118,.10); overflow:hidden; }
    .head { background:var(--navy); color:#fff; padding:22px 24px; }
    .brand { font-weight:800; letter-spacing:-.02em; font-size:18px; display:flex; align-items:center; gap:8px; }
    .brand .dot { width:22px;height:22px;border-radius:7px;background:var(--gold); display:inline-block; }
    .head p { margin:6px 0 0; opacity:.8; font-size:13px; }
    .body { padding:24px; }
    .row { display:flex; justify-content:space-between; padding:9px 0; font-size:14px; border-bottom:1px dashed var(--line); }
    .row:last-of-type { border-bottom:none; }
    .row .n { color:var(--ink2); }
    .total { display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:14px; border-top:2px solid var(--line); }
    .total .amt { font-size:26px; font-weight:800; color:var(--navy); }
    button { width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px; background:var(--navy); color:#fff; font-size:15px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .paid { text-align:center; padding:14px; margin-top:18px; background:#e9f7ef; color:var(--green); border-radius:12px; font-weight:700; }
    .muted { text-align:center; color:var(--ink2); font-size:12px; margin-top:14px; }
    .status { display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:#eef1f8; color:var(--navy); }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="brand"><span class="dot"></span> BMN Connect</div>
      <p>Secure checkout</p>
    </div>
    <div class="body" id="body"><div class="muted">Loading order…</div></div>
  </div>

  <script>
    const ref = new URLSearchParams(location.search).get('ref');
    const bodyEl = document.getElementById('body');
    const rupee = (n) => '₹' + Number(n).toLocaleString('en-IN');

    async function load() {
      if (!ref) { bodyEl.innerHTML = '<div class="muted">Invalid payment link.</div>'; return; }
      try {
        const r = await fetch('/omni/pay/' + encodeURIComponent(ref));
        if (!r.ok) throw new Error();
        render(await r.json());
      } catch { bodyEl.innerHTML = '<div class="muted">Order not found.</div>'; }
    }

    function render(o) {
      const items = (o.items || []).map(i =>
        `<div class="row"><span class="n">${i.name} × ${i.quantity}</span><span>${rupee(i.priceInr * i.quantity)}</span></div>`
      ).join('');
      const paid = ['PAID','SHIPPED','DELIVERED'].includes(o.status);
      bodyEl.innerHTML =
        `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
           <strong>Order ${o.number}</strong><span class="status">${o.status}</span>
         </div>
         ${items}
         <div class="total"><span class="n">Total</span><span class="amt">${rupee(o.subtotalInr)}</span></div>
         ${paid
           ? '<div class="paid">✓ Payment received — thank you!</div>'
           : '<button id="pay" onclick="pay()">Pay ' + rupee(o.subtotalInr) + ' now</button>'}
         <div class="muted">Payments are simulated in this demo environment.</div>`;
    }

    async function pay() {
      const btn = document.getElementById('pay');
      btn.disabled = true; btn.textContent = 'Processing…';
      try {
        const r = await fetch('/omni/pay/' + encodeURIComponent(ref), { method: 'POST' });
        render(await r.json());
      } catch { btn.disabled = false; btn.textContent = 'Try again'; }
    }

    load();
  </script>
</body>
</html>
