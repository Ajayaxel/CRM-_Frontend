<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Portal · BMN Connect</title>
  <style>
    :root { --navy:#132376; --gold:#E6A23C; --ink:#1c2333; --ink2:#5b6270; --line:#e7e2d8; --bg:#f4f1ea; --green:#2f9e63; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width:960px; margin:0 auto; padding:20px 16px 60px; }
    .head { background:var(--brand,var(--navy)); color:#fff; border-radius:18px; padding:24px 26px; }
    .head h1 { margin:0; font-size:22px; }
    .head p { margin:6px 0 0; opacity:.85; font-size:13px; }
    .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:16px 0; }
    .kpi { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
    .kpi .v { font-size:22px; font-weight:800; color:var(--navy); }
    .kpi .l { font-size:12px; color:var(--ink2); margin-top:2px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; }
    h3 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink2); margin:0 0 12px; }
    .prop { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
    .prop:last-child { border-bottom:none; }
    .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:#eef1f8; color:var(--navy); }
    .muted { color:var(--ink2); font-size:12.5px; }
    .row { display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dashed var(--line); }
    @media(max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  </style>
</head>
<body>
  <div class="wrap" id="root"><div class="card">Loading owner portal…</div></div>
  <script>
    const key = new URLSearchParams(location.search).get('key');
    const money = (n)=> n==null?'—':(n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(1)+' L':'₹'+Number(n).toLocaleString('en-IN'));
    async function load(){
      if(!key){ document.getElementById('root').innerHTML='<div class="card">Invalid portal link.</div>'; return; }
      try{ const r=await fetch('/api/realestate/owner-portal/'+encodeURIComponent(key)); if(!r.ok) throw 0; render(await r.json()); }
      catch{ document.getElementById('root').innerHTML='<div class="card">No properties found for this owner.</div>'; }
    }
    function render(d){
      const s=d.summary, a=d.agency||{};
      if(a.primaryColor) document.documentElement.style.setProperty('--brand',a.primaryColor);
      document.getElementById('root').innerHTML = `
        <div class="head"><h1>Welcome, ${d.owner}</h1><p>Your portfolio with ${a.name||'BMN Connect'}${a.phone?' · '+a.phone:''}</p></div>
        <div class="kpis">
          <div class="kpi"><div class="v">${s.totalProperties}</div><div class="l">Properties</div></div>
          <div class="kpi"><div class="v">${money(s.portfolioValue)}</div><div class="l">Portfolio value</div></div>
          <div class="kpi"><div class="v">${money(s.monthlyIncome)}</div><div class="l">Monthly income</div></div>
          <div class="kpi"><div class="v">${s.occupancyPct}%</div><div class="l">Occupancy</div></div>
        </div>
        <div class="card"><h3>Your properties</h3>${d.properties.map(p=>`
          <div class="prop"><div><div style="font-weight:700">${p.title}</div>
            <div class="muted">${p.reference} · ${p.area||''} ${p.city||''}${p.tenant?' · Tenant: '+p.tenant:''}</div></div>
            <div style="text-align:right"><div style="font-weight:800;color:var(--navy)">${money(p.rentInr||p.priceInr)}${p.rentInr?'/mo':''}</div>
            <span class="badge">${(p.status||'').replace('_',' ')}</span></div></div>`).join('')}</div>
        <div class="card"><h3>Maintenance history</h3>${d.maintenance.length?d.maintenance.map(m=>`
          <div class="row"><span>${m.title} <span class="muted">· ${m.property?m.property.reference:''}</span></span>
          <span>${m.status}${m.costInr?' · '+money(m.costInr):''}</span></div>`).join(''):'<div class="muted">No maintenance records.</div>'}</div>`;
    }
    load();
  </script>
</body>
</html>
