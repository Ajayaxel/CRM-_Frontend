<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Brochure · BMN Connect</title>
  <style>
    :root { --navy:#132376; --gold:#E6A23C; --ink:#1c2333; --ink2:#5b6270; --line:#e7e2d8; --bg:#f4f1ea; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--ink); }
    .bar { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:8px; justify-content:flex-end; }
    .bar button, .bar a { border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .bar .primary { background:var(--navy); color:#fff; border-color:var(--navy); }
    .sheet { max-width:820px; margin:22px auto; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(19,35,118,.08); }
    .head { background:var(--brand,var(--navy)); color:#fff; padding:22px 28px; display:flex; justify-content:space-between; align-items:center; }
    .head .logo { width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.18); display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px; }
    .head h1 { margin:0; font-size:18px; font-weight:800; }
    .head .sub { opacity:.85; font-size:12.5px; margin-top:2px; }
    .hero { height:280px; background:linear-gradient(135deg,var(--brand,var(--navy)),#2a3a9e); display:flex; align-items:center; justify-content:center; position:relative; }
    .hero .emoji { font-size:96px; }
    .hero img { width:100%; height:100%; object-fit:cover; }
    .status { position:absolute; top:16px; right:16px; background:rgba(255,255,255,.92); color:var(--navy); font-size:12px; font-weight:700; padding:5px 12px; border-radius:20px; }
    .body { padding:24px 28px; }
    .titlerow { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .titlerow h2 { margin:0; font-size:24px; letter-spacing:-.02em; }
    .ref { color:var(--ink2); font-size:13px; margin-top:4px; }
    .price { text-align:right; }
    .price .big { font-size:26px; font-weight:800; color:var(--navy); }
    .price .rent { color:var(--ink2); font-size:13px; }
    .specs { display:flex; gap:22px; margin:18px 0; padding:16px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); flex-wrap:wrap; }
    .spec { text-align:center; }
    .spec .v { font-size:19px; font-weight:800; }
    .spec .l { font-size:11px; color:var(--ink2); text-transform:uppercase; letter-spacing:.05em; }
    .sect { margin-top:20px; }
    .sect h3 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink2); margin:0 0 10px; }
    .amen { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12.5px; }
    .desc { font-size:13.5px; line-height:1.6; color:#333; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .kv { font-size:13px; padding:5px 0; display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); }
    .kv .k { color:var(--ink2); }
    .foot { display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:18px; border-top:2px solid var(--line); }
    .agent { font-size:13px; }
    .agent .n { font-weight:800; font-size:15px; }
    .qr { text-align:center; }
    .qr img { width:96px; height:96px; border:1px solid var(--line); border-radius:8px; }
    .qr .l { font-size:10.5px; color:var(--ink2); margin-top:4px; }
    @media print { .bar { display:none; } body { background:#fff; } .sheet { box-shadow:none; border:none; margin:0; max-width:100%; } }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="window.print()">⬇ Download PDF</button>
    <a id="wa" target="_blank" rel="noreferrer">🟢 WhatsApp</a>
    <a id="email">✉️ Email</a>
  </div>
  <div id="root" class="sheet"><div class="body">Loading brochure…</div></div>

  <script>
    const id = new URLSearchParams(location.search).get('id');
    const TYPE = { APARTMENT:'🏢',VILLA:'🏡',TOWNHOUSE:'🏘️',PENTHOUSE:'🌆',OFFICE:'🏬',SHOP:'🏪',WAREHOUSE:'🏭',LAND:'🌄',STUDIO:'🛋️' };
    const money = (n) => n==null ? '—' : (n>=1e7 ? '₹'+(n/1e7).toFixed(2)+' Cr' : n>=1e5 ? '₹'+(n/1e5).toFixed(1)+' L' : '₹'+Number(n).toLocaleString('en-IN'));

    async function load() {
      if (!id) { document.getElementById('root').innerHTML = '<div class="body">Invalid brochure link.</div>'; return; }
      try {
        const r = await fetch('/api/properties/brochure/' + encodeURIComponent(id));
        if (!r.ok) throw new Error();
        render(await r.json());
      } catch { document.getElementById('root').innerHTML = '<div class="body">Could not load this property.</div>'; }
    }

    function render(d) {
      const p = d.property, a = d.agency || {};
      const brand = a.primaryColor || '#132376';
      document.documentElement.style.setProperty('--brand', brand);
      const url = location.href;
      const img = (p.images && p.images[0]) ? `<img src="${p.images[0]}" onerror="this.style.display='none'"/>` : `<span class="emoji">${TYPE[p.type]||'🏠'}</span>`;
      const specs = [
        p.bedrooms ? { v: p.bedrooms, l: 'Beds' } : null,
        p.bathrooms ? { v: p.bathrooms, l: 'Baths' } : null,
        p.areaSqft ? { v: p.areaSqft.toLocaleString('en-IN'), l: 'Sq Ft' } : null,
        p.parking ? { v: p.parking, l: 'Parking' } : null,
        p.roiPct ? { v: p.roiPct + '%', l: 'ROI' } : null,
      ].filter(Boolean);
      const nearby = [];
      if (p.nearbySchools) nearby.push(['Nearby schools', p.nearbySchools]);
      if (p.nearbyMetro) nearby.push(['Nearby metro', p.nearbyMetro]);
      if (p.rentalYieldPct) nearby.push(['Rental yield', p.rentalYieldPct + '%']);
      if (p.serviceChargeInr) nearby.push(['Service charge', money(p.serviceChargeInr)]);

      document.getElementById('root').innerHTML = `
        <div class="head">
          <div style="display:flex;gap:12px;align-items:center">
            <div class="logo">${(a.name||'BMN')[0]}</div>
            <div><h1>${a.name || 'BMN Connect'}</h1><div class="sub">${a.city || ''}${a.phone ? ' · ' + a.phone : ''}</div></div>
          </div>
          <div style="font-size:12px;opacity:.85">${p.listingType === 'RENT' ? 'For Rent' : p.listingType === 'BOTH' ? 'Sale / Rent' : 'For Sale'}</div>
        </div>
        <div class="hero">${img}<span class="status">${(p.status||'').replace('_',' ')}</span></div>
        <div class="body">
          <div class="titlerow">
            <div><h2>${p.title}</h2><div class="ref">${p.reference} · ${(p.type||'').charAt(0)+ (p.type||'').slice(1).toLowerCase()}${p.area ? ' · ' + p.area : ''}${p.city ? ', ' + p.city : ''}</div></div>
            <div class="price"><div class="big">${money(p.priceInr)}</div>${p.rentInr ? `<div class="rent">${money(p.rentInr)}/mo</div>` : ''}</div>
          </div>
          <div class="specs">${specs.map(s => `<div class="spec"><div class="v">${s.v}</div><div class="l">${s.l}</div></div>`).join('')}</div>
          ${p.description ? `<div class="sect"><h3>Overview</h3><div class="desc">${p.description}</div></div>` : ''}
          ${(p.amenities && p.amenities.length) ? `<div class="sect"><h3>Amenities</h3><div class="amen">${p.amenities.map(x => `<span class="chip">${x}</span>`).join('')}</div></div>` : ''}
          ${nearby.length ? `<div class="sect"><h3>Location & investment</h3><div class="grid2">${nearby.map(([k,v]) => `<div class="kv"><span class="k">${k}</span><span>${v}</span></div>`).join('')}</div></div>` : ''}
          <div class="foot">
            <div class="agent">
              <div class="n">${p.ownerName || a.name || 'BMN Connect'}</div>
              <div style="color:var(--ink2)">${p.ownerPhone || a.phone || ''}${a.email ? ' · ' + a.email : ''}</div>
            </div>
            <div class="qr">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(url)}" alt="QR" onerror="this.style.display='none'"/>
              <div class="l">Scan for details</div>
            </div>
          </div>
        </div>`;

      const share = `${p.title} — ${money(p.priceInr)}\n${p.reference}, ${p.area||''} ${p.city||''}\n${url}`;
      document.getElementById('wa').href = 'https://wa.me/?text=' + encodeURIComponent(share);
      document.getElementById('email').href = `mailto:?subject=${encodeURIComponent('Property: ' + p.title)}&body=${encodeURIComponent(share)}`;
    }
    load();
  </script>
</body>
</html>
